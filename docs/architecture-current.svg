<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
  <title>Current supply chain Fabric architecture</title>
  <defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="390" rx="18" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Current Runtime Architecture</text>
  <g font-family="Arial" font-size="15" text-anchor="middle">
    <rect x="35" y="95" width="250" height="210" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="160" y="125" font-weight="700" fill="#1e3a8a">UAT</text><text x="160" y="160" fill="#1e3a8a">Local Python generator</text><text x="160" y="190" fill="#1e3a8a">Manual Bronze upload</text><text x="160" y="220" fill="#1e3a8a">SupplyChain-UAT</text><text x="160" y="250" fill="#1e3a8a">Incremental pipeline</text><text x="160" y="280" fill="#1e3a8a">Direct Lake → Report</text>
    <rect x="335" y="95" width="210" height="210" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="440" y="130" font-weight="700" fill="#14532d">OneLake Bronze</text><text x="440" y="170" fill="#14532d">18 linked entities</text><text x="440" y="205" fill="#14532d">Dated CSV partitions</text><text x="440" y="240" fill="#14532d">_READY marker for PROD</text>
    <rect x="595" y="95" width="210" height="210" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="700" y="130" font-weight="700" fill="#7c2d12">Fabric processing</text><text x="700" y="170" fill="#7c2d12">Silver conformance</text><text x="700" y="205" fill="#7c2d12">Gold dimensions/facts</text><text x="700" y="240" fill="#7c2d12">DQ + watermarks</text>
    <rect x="855" y="95" width="310" height="210" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1010" y="130" font-weight="700" fill="#4c1d95">PROD entry and consumption</text><text x="1010" y="170" fill="#4c1d95">Azure Function</text><text x="1010" y="205" fill="#4c1d95">SupplyChain-PROD</text><text x="1010" y="240" fill="#4c1d95">Semantic Model → Power BI</text>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#b)"><line x1="285" y1="200" x2="330" y2="200"/><line x1="545" y1="200" x2="590" y2="200"/><line x1="805" y1="200" x2="850" y2="200"/></g>
  <text x="600" y="355" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">UAT and PROD share the contract and transformation design; entry points and bindings remain isolated.</text>
</svg>
