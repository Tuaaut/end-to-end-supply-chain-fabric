<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <title>Current supply chain business flow</title>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="300" rx="18" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Supply Chain Control Tower — Business Flow</text>
  <g font-family="Arial" font-size="16" text-anchor="middle">
    <rect x="45" y="105" width="170" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="130" y="140" fill="#1e3a8a">Planning</text><text x="130" y="166" fill="#1e3a8a">Demand • Inventory</text>
    <rect x="265" y="105" width="170" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="350" y="140" fill="#14532d">Orders</text><text x="350" y="166" fill="#14532d">Purchase • Sales</text>
    <rect x="485" y="105" width="170" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="570" y="140" fill="#78350f">Fulfillment</text><text x="570" y="166" fill="#78350f">Warehouse • Pick/Pack</text>
    <rect x="705" y="105" width="170" height="90" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="790" y="140" fill="#831843">Transport</text><text x="790" y="166" fill="#831843">Ship • Deliver • OTIF</text>
    <rect x="925" y="105" width="230" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1040" y="140" fill="#4c1d95">Decisions</text><text x="1040" y="166" fill="#4c1d95">Cost • Risk • Scenarios</text>
  </g>
  <g stroke="#2563eb" stroke-width="3" marker-end="url(#a)"><line x1="215" y1="150" x2="260" y2="150"/><line x1="435" y1="150" x2="480" y2="150"/><line x1="655" y1="150" x2="700" y2="150"/><line x1="875" y1="150" x2="920" y2="150"/></g>
</svg>
