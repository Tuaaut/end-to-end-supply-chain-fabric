<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <title>Current supply chain business flow</title>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="300" rx="18" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Supply Chain Control Tower — Business Flow</text>

  <g font-family="Arial" text-anchor="middle">
    <rect x="65" y="100" width="190" height="150" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
    <text x="160" y="140" font-size="16" font-weight="700" fill="#0C447C">Planning</text>
    <text x="160" y="170" font-size="14" fill="#185FA5">Demand &amp;</text>
    <text x="160" y="192" font-size="14" fill="#185FA5">inventory</text>

    <rect x="285" y="100" width="190" height="150" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
    <text x="380" y="140" font-size="16" font-weight="700" fill="#27500A">Orders</text>
    <text x="380" y="170" font-size="14" fill="#3B6D11">Purchase &amp;</text>
    <text x="380" y="192" font-size="14" fill="#3B6D11">sales</text>

    <rect x="505" y="100" width="190" height="150" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
    <text x="600" y="140" font-size="16" font-weight="700" fill="#633806">Fulfillment</text>
    <text x="600" y="170" font-size="14" fill="#854F0B">Pick &amp;</text>
    <text x="600" y="192" font-size="14" fill="#854F0B">pack</text>

    <rect x="725" y="100" width="190" height="150" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="2"/>
    <text x="820" y="140" font-size="16" font-weight="700" fill="#72243E">Transport</text>
    <text x="820" y="170" font-size="14" fill="#993556">Ship &amp;</text>
    <text x="820" y="192" font-size="14" fill="#993556">deliver</text>

    <rect x="945" y="100" width="190" height="150" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
    <text x="1040" y="140" font-size="16" font-weight="700" fill="#3C3489">Decisions</text>
    <text x="1040" y="170" font-size="14" fill="#534AB7">Cost, risk,</text>
    <text x="1040" y="192" font-size="14" fill="#534AB7">scenarios</text>
  </g>

  <g stroke="#475569" stroke-width="3" marker-end="url(#a)">
    <line x1="255" y1="175" x2="280" y2="175"/>
    <line x1="475" y1="175" x2="500" y2="175"/>
    <line x1="695" y1="175" x2="720" y2="175"/>
    <line x1="915" y1="175" x2="940" y2="175"/>
  </g>
</svg>
